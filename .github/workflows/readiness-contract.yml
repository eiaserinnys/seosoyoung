name: Readiness contract

on:
  pull_request:
    paths:
      - pyproject.toml
      - requirements.txt
      - src/seosoyoung/rescue/main.py
      - src/seosoyoung/rescue/readiness.py
      - tests/rescue/readiness_bootstrap_probe.py
      - tests/rescue/test_readiness_contract.py
      - readiness-contract.json
      - .github/workflows/readiness-contract.yml
  push:
    paths:
      - pyproject.toml
      - requirements.txt
      - src/seosoyoung/rescue/main.py
      - src/seosoyoung/rescue/readiness.py
      - tests/rescue/readiness_bootstrap_probe.py
      - tests/rescue/test_readiness_contract.py
      - readiness-contract.json
      - .github/workflows/readiness-contract.yml
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m pytest -q tests/rescue/test_readiness_contract.py
